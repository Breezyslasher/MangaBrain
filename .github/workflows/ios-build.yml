name: iOS IPA

# Builds an unsigned .ipa for real iPhones and iPads (arm64), the same way
# Breezyslasher/Yamtrack_andriod builds its iOS app. A sideloading tool
# (Sideloadly, AltStore, SideStore) signs it with the user's own Apple ID at
# install, so CI needs no certificate or provisioning profile, and no Mac is
# needed at home.
#
# Only ios/** triggers it: a macOS runner is the costliest one GitHub has,
# and most commits here are Python. A tag ios-v* also attaches the .ipa to
# a draft GitHub release.

on:
  push:
    branches: ['**']
    tags: ['ios-v*']
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: iOS (.ipa, unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS devices (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MangaBrain.xcodeproj \
            -scheme MangaBrain \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Pack .ipa
        run: |
          set -eu
          app=build/Build/Products/Release-iphoneos/MangaBrain.app
          test -d "$app"
          mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../MangaBrain.ipa Payload)
          ls -la MangaBrain.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MangaBrain-ios-${{ github.run_number }}
          path: ios/MangaBrain.ipa
          if-no-files-found: error

  # Screenshots from the iOS Simulator, against ios/screenshots/mock_server.py
  # (real AniList titles, made-up scores), so the app can be looked at
  # without an iPhone. Debug build: the launch-argument hooks that open each
  # screen exist only there.
  screenshots:
    name: Simulator screenshots
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project MangaBrain.xcodeproj \
            -scheme MangaBrain \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Start the mock server
        run: |
          nohup python3 screenshots/mock_server.py > mock.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8009/settings >/dev/null && break
            sleep 1
          done
          head -3 mock.log

      - name: Take screenshots
        run: screenshots/take.sh build/Build/Products/Debug-iphonesimulator/MangaBrain.app shots

      # Small copies in the log too, for reading where artifacts need a login.
      - name: Print small previews
        run: |
          for f in shots/*.png; do
            sips -s format jpeg -s formatOptions 50 -Z 720 "$f" --out /tmp/preview.jpg >/dev/null
            echo "PREVIEW-BEGIN $(basename "$f" .png)"
            base64 -i /tmp/preview.jpg | fold -w 4000
            echo "PREVIEW-END"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MangaBrain-ios-screenshots-${{ github.run_number }}
          path: |
            ios/shots/*.png
            ios/mock.log
          if-no-files-found: warn

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: MangaBrain iOS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: dist/MangaBrain-ios-*/*.ipa

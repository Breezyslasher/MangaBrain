name: mal-list-probe

# Does the official MyAnimeList list fetch work, and is our request shaped
# right? Separate from dub-probe.yml because it answers a different
# question against a different host: api.myanimelist.net serves lists,
# api.jikan.moe serves cast data, and only the second is known to refuse
# GitHub's runners. Whether the first one answers here is itself a finding.
#
# The client id comes from a repository secret, not from the repo. A MAL
# client id is not an OAuth secret - Yamtrack ships one in public source -
# but it is still an identifier whose rate limit is the owner's, and this
# repository has no need to publish one.
on:
  workflow_dispatch:
    inputs:
      username:
        description: MyAnimeList username whose public list to fetch
        required: true

permissions:
  contents: read

concurrency:
  group: mal-list-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The probe imports the router so it exercises the real fetch, which
      # pulls in FastAPI and the database layer. No database is contacted,
      # but the imports have to resolve - including psycopg-pool, which is
      # a separate distribution from psycopg[binary] and was missing from
      # the first version of this list.
      - name: Install dependencies
        run: |
          pip install "httpx>=0.27" "fastapi>=0.115" "pydantic-settings>=2.3" \
            "psycopg[binary]>=3.2" "psycopg-pool>=3.2" "pgvector>=0.3"

      - name: Fetch the list
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          if [ -z "$MAL_CLIENT_ID" ]; then
            echo "No MAL_CLIENT_ID secret is set on this repository."
            echo "Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          python -m pipeline.probe_mal_list --username "${{ inputs.username }}"

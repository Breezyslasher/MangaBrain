name: screen-survey

# Could TV shows and films be ranked the way anime is? Measures TMDB
# (films and TV, sampled uniformly from its daily id exports) and TVmaze
# (TV, no key) for synopsis and tag coverage. See pipeline/survey_screen.py.
#
# TMDB needs a free API key in the TMDB_API_KEY repository secret (a v3
# key or a v4 read access token). Without it the TMDB half is skipped and
# TVmaze still runs. Nothing is stored; results are in the log and in the
# screen-survey artifact.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "survey = measure the sources; terms = print TMDB's and TVmaze's terms; tmdb-check = run every request pipeline.sync_tmdb makes, live"
        required: false
        type: choice
        default: survey
        options:
          - survey
          - terms
          - tmdb-check
          - tmdb-titles
      sample:
        description: titles per source and type
        required: false
        default: "300"
      min_synopsis:
        description: characters of synopsis a title must have to count
        required: false
        default: "200"
      titles:
        description: "tmdb-titles: kind/id refs, space separated (movie/68721); empty = a set of famous films"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: screen-survey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "httpx>=0.27"

      # The terms decide what may be done with TMDB data - above all,
      # whether a dataset may be published - and they change. The dev
      # container cannot reach themoviedb.org, so the runner reads the live
      # page and prints its text, rather than anyone relying on memory.
      - name: Print TMDB's and TVmaze's terms
        if: ${{ inputs.mode == 'terms' }}
        run: |
          for url in https://www.themoviedb.org/api-terms-of-use https://www.themoviedb.org/terms-of-use \
              https://www.tvmaze.com/api https://www.tvmaze.com/site/terms https://www.tvmaze.com/site/legal; do
            echo "===== $url ($(date -u +%F))"
            curl -sSL -A "MangaBrain terms check" "$url" | python -c '
          import html, re, sys
          from html.parser import HTMLParser

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.out, self.skip = [], 0
              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style", "nav", "header", "footer"):
                      self.skip += 1
                  if tag in ("p", "li", "h1", "h2", "h3", "h4", "br", "div"):
                      self.out.append("\n")
              def handle_endtag(self, tag):
                  if tag in ("script", "style", "nav", "header", "footer") and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      self.out.append(data)

          parser = Text()
          parser.feed(sys.stdin.read())
          text = re.sub(r"[ \t]+", " ", "".join(parser.out))
          print(re.sub(r"\n\s*\n+", "\n\n", text).strip())
          '
          done

      # Every TMDB request the films and TV sync makes, against the live
      # API with the repository's key, and what each returned.
      - name: Check TMDB requests
        if: ${{ inputs.mode == 'tmdb-check' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          pip install "psycopg[binary]>=3.1" "pydantic-settings>=2.3"
          python -m pipeline.check_tmdb

      # Whether the import keeps particular titles, and why: overview
      # length and keyword count against both rules.
      - name: Check TMDB titles
        if: ${{ inputs.mode == 'tmdb-titles' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TITLES: ${{ inputs.titles }}
        run: |
          pip install "psycopg[binary]>=3.1" "pydantic-settings>=2.3"
          python -m pipeline.check_tmdb --titles $TITLES

      - name: Survey TV and film sources
        if: ${{ inputs.mode == 'survey' || inputs.mode == '' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python -m pipeline.survey_screen \
            --sample "${{ inputs.sample || '300' }}" \
            --min-synopsis "${{ inputs.min_synopsis || '200' }}" \
            --json screen-survey.json

      - name: Upload result
        if: ${{ always() && (inputs.mode == 'survey' || inputs.mode == '') }}
        uses: actions/upload-artifact@v4
        with:
          name: screen-survey
          path: screen-survey.json
          if-no-files-found: ignore

name: dataset-publish

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      resume_attempt:
        description: internal counter for the self-resume chain; leave at 0
        required: false
        default: "0"

# actions: write lets a timed-out run dispatch its own resume.
permissions:
  contents: write
  actions: write

# Budget: the first full run measured sync 272 min + embed 67 min, so a
# from-scratch build barely fits the 6 h job limit. Every run therefore
# checkpoints its database state to the actions cache (even on failure), and
# a rerun restores it: a timed-out sync resumes mid-scan via sync_state, a
# completed sync within 24 h is skipped entirely (--skip-if-fresh), and the
# embed step only processes entries the restored checkpoint is missing. The
# step timeouts keep the worst case inside the job limit so the
# checkpoint-save step always gets to run.
jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mangabrain
          POSTGRES_PASSWORD: mangabrain
          POSTGRES_DB: mangabrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mangabrain -d mangabrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://mangabrain:mangabrain@localhost:5432/mangabrain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Install project (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install .

      - name: Restore checkpoint from a previous run
        id: checkpoint
        uses: actions/cache/restore@v4
        with:
          path: checkpoint.dump
          key: dataset-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dataset-checkpoint-

      - name: Load checkpoint into database
        if: steps.checkpoint.outputs.cache-matched-key != ''
        # The dump uses vector columns and trigram indexes; on a fresh CI
        # database those extensions do not exist until something creates
        # them (normally ensure_schema, which raw pg_restore bypasses).
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          pg_restore --dbname "$DATABASE_URL" --clean --if-exists \
            --no-owner --no-privileges checkpoint.dump
          rm checkpoint.dump

      - name: Full AniList sync
        id: sync
        timeout-minutes: 280
        run: python -m pipeline.sync_anilist --skip-if-fresh 24

      - name: Generate embeddings
        id: embed
        timeout-minutes: 70
        run: python -m pipeline.embed

      # Runs even when sync or embed failed or timed out, so the next
      # trigger resumes instead of restarting. The key is unique per attempt
      # (same-key saves are rejected); restore-keys picks the newest.
      - name: Save checkpoint
        if: always()
        run: python -m pipeline.snapshot --out checkpoint.dump

      - name: Upload checkpoint to cache
        id: checkpoint_upload
        if: always()
        uses: actions/cache/save@v4
        with:
          path: checkpoint.dump
          key: dataset-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}

      # A sync or embed step timeout is the designed split-across-runs case:
      # the checkpoint holds the progress, so dispatch a fresh run to resume
      # it instead of waiting for a human or next week's cron. Only fires
      # when the checkpoint actually uploaded (a failure elsewhere, like a
      # broken restore, must not loop), and the attempt counter caps the
      # chain so a persistent failure stops after three resumes.
      - name: Dispatch resume run
        if: >-
          always() && steps.checkpoint_upload.outcome == 'success'
          && (steps.sync.outcome == 'failure' || steps.embed.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ATTEMPT="${{ github.event.inputs.resume_attempt || '0' }}"
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "resume chain exhausted after $ATTEMPT attempts; leaving it to the next cron"
            exit 0
          fi
          echo "dispatching resume attempt $((ATTEMPT + 1))"
          gh workflow run dataset-publish.yml -R "$GITHUB_REPOSITORY" \
            -f resume_attempt=$((ATTEMPT + 1))

      - name: Dump snapshot
        run: python -m pipeline.snapshot --out mangabrain-dataset.dump

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Replace the asset in place instead of deleting and recreating the
        # release: delete-then-create leaves a minutes-long window where the
        # dataset-latest download URL 404s and fresh installs fall back to a
        # slow full sync. --clobber shrinks that window to the upload itself.
        run: |
          NOTES="Weekly catalog snapshot: media, relations, embeddings, and sync checkpoints. Restore with pipeline.restore or set SEED_SNAPSHOT_URL; the nightly incremental sync continues from this snapshot's checkpoint. Data sourced from the AniList API."
          if gh release view dataset-latest > /dev/null 2>&1; then
            gh release upload dataset-latest mangabrain-dataset.dump --clobber
            gh release edit dataset-latest \
              --title "Catalog snapshot $(date -u +%F)" --notes "$NOTES"
          else
            gh release create dataset-latest mangabrain-dataset.dump \
              --title "Catalog snapshot $(date -u +%F)" --notes "$NOTES"
          fi

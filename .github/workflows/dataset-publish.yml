name: dataset-publish

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      resume_attempt:
        description: internal counter for the self-resume chain; leave at 0
        required: false
        default: "0"

# actions: write lets a timed-out run dispatch its own resume.
permissions:
  contents: write
  actions: write

# Budget: the first full run measured sync 272 min + embed 67 min, so a
# from-scratch build barely fits the 6 h job limit. Every run therefore
# checkpoints its database state to the actions cache (even on failure), and
# a rerun restores it: a timed-out sync resumes mid-scan via sync_state, a
# completed sync within 24 h is skipped entirely (--skip-if-fresh), and the
# embed step only processes entries the restored checkpoint is missing. The
# step timeouts keep the worst case inside the job limit so the
# checkpoint-save step always gets to run.
jobs:
  build-dataset:
    # Pinned, not ubuntu-latest. The pgvector service is pg16 and these jobs
    # shell out to pg_dump/pg_restore against it, and ubuntu-latest has rolled
    # to Ubuntu 26.04 "resolute", whose archive no longer carries
    # postgresql-client-16: "E: Unable to locate package
    # postgresql-client-16", which failed the job 30 seconds in. 24.04 still
    # has it. The alternative, PGDG's apt repo, has no resolute suite yet, so
    # pinning is the predictable fix; revisit when pg16 client packages exist
    # for a newer runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mangabrain
          POSTGRES_PASSWORD: mangabrain
          POSTGRES_DB: mangabrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mangabrain -d mangabrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://mangabrain:mangabrain@localhost:5432/mangabrain
      # Python block-buffers stdout into a pipe, so without this the
      # long sync/embed/benchmark steps show an empty log until they
      # finish. The container image sets it too; CI runs pip-installed
      # Python directly and needs it here.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Install project (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install .

      - name: Restore checkpoint from a previous run
        id: checkpoint
        uses: actions/cache/restore@v4
        with:
          path: checkpoint.dump
          key: dataset-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dataset-checkpoint-

      - name: Load checkpoint into database
        if: steps.checkpoint.outputs.cache-matched-key != ''
        # The dump uses vector columns and trigram indexes; on a fresh CI
        # database those extensions do not exist until something creates
        # them (normally ensure_schema, which raw pg_restore bypasses).
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          pg_restore --dbname "$DATABASE_URL" --clean --if-exists \
            --no-owner --no-privileges checkpoint.dump
          rm checkpoint.dump

      - name: Full AniList sync
        id: sync
        timeout-minutes: 280
        run: python -m pipeline.sync_anilist --skip-if-fresh 24

      # A full re-embed with the 768-dim base model takes several of these
      # 70-minute windows; the checkpoint + self-resume chain below splits
      # it across runs. --prune-stale only executes once embedding is fully
      # complete (the command runs to the end without timing out), so
      # published snapshots carry exactly one embedding version.
      - name: Generate embeddings
        id: embed
        timeout-minutes: 70
        run: python -m pipeline.embed --prune-stale

      # Runs even when sync or embed failed or timed out, so the next
      # trigger resumes instead of restarting. The key is unique per attempt
      # (same-key saves are rejected); restore-keys picks the newest.
      - name: Save checkpoint
        if: always()
        run: python -m pipeline.snapshot --out checkpoint.dump

      - name: Upload checkpoint to cache
        id: checkpoint_upload
        if: always()
        uses: actions/cache/save@v4
        with:
          path: checkpoint.dump
          key: dataset-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}

      # A sync or embed step timeout is the designed split-across-runs case:
      # the checkpoint holds the progress, so dispatch a fresh run to resume
      # it instead of waiting for a human or next week's cron. Only fires
      # when the checkpoint actually uploaded (a failure elsewhere, like a
      # broken restore, must not loop), and the attempt counter caps the
      # chain so a persistent failure stops after three resumes.
      - name: Dispatch resume run
        if: >-
          always() && steps.checkpoint_upload.outcome == 'success'
          && (steps.sync.outcome == 'failure' || steps.embed.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ATTEMPT="${{ github.event.inputs.resume_attempt || '0' }}"
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "resume chain exhausted after $ATTEMPT attempts; leaving it to the next cron"
            exit 0
          fi
          echo "dispatching resume attempt $((ATTEMPT + 1))"
          # --ref, or the resume silently lands on the default branch: gh
          # defaults there, so a run started from a branch resumes with a
          # different workflow definition than it began with. That happened
          # here - a branch run's resume went to main, where neither the
          # runner pin nor the dub step existed, and died in 29 seconds.
          gh workflow run dataset-publish.yml -R "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f resume_attempt=$((ATTEMPT + 1))

      # The published dataset carries dub data from both sources so nobody
      # restoring it has to fetch either themselves.
      #
      # AniList gives the English measurement. This used to be excluded as a
      # twelve-hour job - one request per title, on the belief that AniList
      # would not populate a nested connection across a page of parents.
      # That was wrong: the probe behind it omitted node { id }, without
      # which voiceActors resolves to null on every edge, and the fix changed
      # the paging and the node together so the per-title shape took the
      # credit. A fifty-id request is served whole with every cast
      # populated (pipeline.probe_paged_cast), so the pass is ~444 requests,
      # about fifteen minutes, and belongs here after all.
      #
      # ANN gives the other eight languages, since AniList is asked about one
      # language per aliased field. It hands over its whole anime list in ~22
      # paged requests and 20 casts per request and tags every cast entry
      # with its language.
      #
      # Both are incremental - AniList skips rows with a dub_checked_at and
      # ANN skips rows already sourced from it - so a timeout in either
      # resumes on the next run like sync and embed do. Propagation then runs
      # off whichever direct source exists.
      #
      # Last, and always. Three constraints land it here.
      #
      # After the checkpoint upload, because the job budget note above keeps
      # sync + embed (280 + 70) inside the 358-minute job limit precisely so
      # the checkpoint always gets saved; putting this ahead of it would let
      # a cold run die before checkpointing and lose everything. On a cold
      # run these steps are cut off by the job timeout and simply resume on
      # the next one; on a warm run sync is a no-op and they have hours.
      #
      # After the resume dispatch, because a worst-case run reaching here at
      # minute 350 would have this step cut off by the job timeout, and a
      # job timeout kills the steps after it too. Ahead of the dispatch that
      # would cost the run its resume, which is what makes this workflow
      # finish at all across runs. Losing a resume is far worse than
      # finishing with partial dub data.
      #
      # if: always() because dub data has nothing to do with embeddings: an
      # embed that times out would otherwise skip this step on every run of
      # a long re-embed chain, so the languages would never be fetched. The
      # pass is incremental, so each run adds to the last and it needs no
      # resume trigger of its own.
      - name: English dub measurement from AniList
        id: dub_anilist
        if: always()
        timeout-minutes: 35
        run: python -m pipeline.backfill_dub

      - name: Dub languages from ANN
        id: dub_ann
        if: always()
        timeout-minutes: 40
        run: |
          python -m pipeline.backfill_dub_ann
          python -m pipeline.propagate_dub

      - name: Dump snapshot
        run: python -m pipeline.snapshot --out mangabrain-dataset.dump

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Releases on this repo are immutable: assets cannot be replaced and
        # a used tag can never be reused, deleted or not (the original
        # rolling dataset-latest tag is permanently burned this way). Every
        # snapshot therefore gets a fresh dated tag marked as latest, and
        # consumers download through the stable /releases/latest/download/
        # URL, which follows the release marked latest with no 404 window.
        run: |
          # A notes file, not --notes: the dub section needs paragraphs, and
          # a multi-line shell string inside this block scalar does not
          # survive YAML parsing.
          cat > notes.md <<'NOTES'
          Weekly catalog snapshot: media, relations, embeddings, and sync
          checkpoints. Restore with pipeline.restore or set SEED_SNAPSHOT_URL;
          the nightly incremental sync continues from this snapshot's
          checkpoint. Stable download URL:
          releases/latest/download/mangabrain-dataset.dump. Data sourced from
          the AniList API and Anime News Network.

          Dub data: `dub_languages` comes from ANN and covers every language
          ANN credits a cast in; `english_dub_inferred` is propagated from
          those across sequel, prequel, parent and side-story relations.

          `english_va_count` is AniList's own English measurement: the number
          of distinct English voice actors credited across a title's cast. A
          value above zero means an English dub exists; zero means none was
          found and is NOT the same as "sub only", because AniList records no
          cast at all for much of the long tail. Null means not yet checked,
          and is kept distinct from zero for that reason.

          Both dub passes are incremental and a snapshot may be taken
          mid-pass, so some rows can still be null. The filters accept either
          source as a yes, so a null row is covered whenever ANN matched it.

          Restoring over a populated database REPLACES it. pg_restore
          --clean drops the media table, so any local backfill_dub pass is
          lost; pipeline.restore refuses unless the catalog is empty or
          --force is given.
          NOTES
          TAG="dataset-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" mangabrain-dataset.dump --latest \
            --title "Catalog snapshot $(date -u +%F)" --notes-file notes.md

      - name: Prune old snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        # Dated tags accumulate one ~330 MB release per week; keep the four
        # newest. Immutable releases may still be deleted - their tags just
        # can never be reused, and dated tags never are. Best-effort: a
        # pruning hiccup must not fail a successful publish.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("dataset-"))] | sort_by(.created_at) | reverse | .[4:] | .[].tag_name' |
          while read -r tag; do
            echo "pruning $tag"
            gh release delete "$tag" --cleanup-tag --yes || true
          done

name: dub-probe

# Research probe: is English voice-actor data a usable dub signal, and does
# its coverage survive into the long tail? AniList has no dub field, so the
# candidate signal is "an English voice actor is credited". This runs on CI
# because CI can reach AniList; api.jikan.moe is NOT reachable from GitHub's
# runners, so the MAL cross-check has to run from the NAS. Results appear in
# the "Probe" step log; nothing is written anywhere.
on:
  workflow_dispatch:
    inputs:
      per_stratum:
        description: titles sampled per popularity stratum
        required: false
        default: "15"
      cross_check:
        description: AniList-silent titles to re-check against MAL (0 to skip;
          api.jikan.moe is unreachable from GitHub runners, so this only works
          from the NAS)
        required: false
        default: "0"
      sources:
        description: instead of sampling AniList, probe other dub sources for
          reachability and dump their raw responses
        required: false
        default: "false"
      crosscheck:
        description: bound AniList's dub false negatives against ANN (the
          measurement Jikan was meant to provide before it started refusing
          both CI and the deployment host)
        required: false
        default: "false"
      ann_lookups:
        description: max ANN title lookups in a crosscheck run
        required: false
        default: "30"
      ann_match:
        description: measure ANN's exact-match rate over the WHOLE anime
          catalog (syncs anime only, then matches dry-run). Every match figure
          before this came from a 15-40 title sample.
        required: false
        default: "false"
      kitsu:
        description: probe Kitsu as a dub source. The reason to care is its
          mappings resource, which may carry AniList/MAL ids - an id join
          would remove the name matching that caps ANN at 31.8%.
        required: false
        default: "false"
      languages:
        description: can AniList answer for every dub language at once via
          aliased fields? Would lift non-English dubs off ANN's 31.8% name
          match onto measured per-entry coverage of the whole catalog.
        required: false
        default: "false"
      paged_cast:
        description: can a cast be fetched for a PAGE of media rather than one
          title per request? Decides the English walk's cost by 50x. The probe
          that ruled it out also omitted node, which nulls voiceActors on its
          own, so the two were never separated.
        required: false
        default: "false"

permissions:
  contents: read

# Keyed by probe kind, not just the ref. Grouping every probe together meant
# dispatching one cancelled another mid-run: the ANN cross-check was killed
# and deleted by a reports probe queued while it was still working.
concurrency:
  group: >-
    dub-probe-${{ github.ref }}-${{ inputs.crosscheck || 'n' }}-${{ inputs.sources || 'n' }}-${{ inputs.ann_match || 'n' }}-${{ inputs.paged_cast || 'n' }}-${{ inputs.languages || 'n' }}-${{ inputs.kitsu || 'n' }}
  cancel-in-progress: true

jobs:
  probe:
    if: inputs.ann_match != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Without this the probe's streaming log stays empty until it exits.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install "httpx>=0.27"

      # Runners have open outbound internet, unlike the dev container whose
      # egress proxy blocks these hosts. That distinction is why the other
      # sources went unmeasured for too long.
      - name: Cross-check AniList silence against ANN
        if: inputs.crosscheck == 'true'
        run: |
          python -m pipeline.probe_dub_crosscheck \
            --per-stratum "${{ inputs.per_stratum || '10' }}" \
            --limit "${{ inputs.ann_lookups || '30' }}"

      - name: Probe Kitsu
        if: inputs.kitsu == 'true'
        run: python -m pipeline.probe_kitsu --sample 200 --raw

      - name: Probe AniList's dub languages
        if: inputs.languages == 'true'
        run: python -m pipeline.probe_dub_languages --chars 25

      - name: Probe paged cast retrieval
        if: inputs.paged_cast == 'true'
        run: python -m pipeline.probe_paged_cast --chars 25

      - name: Probe other sources
        if: inputs.sources == 'true'
        run: |
          python -m pipeline.probe_dub_sources --dump --docs --reports --reachability

      - name: Probe
        if: inputs.sources != 'true' && inputs.crosscheck != 'true'
          && inputs.paged_cast != 'true' && inputs.languages != 'true'
          && inputs.kitsu != 'true'
        run: |
          python -m pipeline.probe_dub_coverage \
            --per-stratum "${{ inputs.per_stratum || '15' }}" \
            --cross-check "${{ inputs.cross_check || '0' }}"

  # The ANN match rate is the one number the sampled probes cannot give: every
  # figure so far came from 15-40 titles, and the residue is exactly the kind
  # of thing a small sample gets wrong. It was supposed to arrive from the
  # dataset-publish run, but that pass sits behind a 280-minute full sync and
  # a 70-minute embed inside a 358-minute job, so on a cold cache the dub step
  # has no room left to run. Nothing in the measurement needs embeddings or
  # the manga catalog, so it runs here instead: anime-only sync, then a
  # dry-run match that touches ANN for its index and nothing else.
  ann-match:
    if: inputs.ann_match == 'true'
    runs-on: ubuntu-24.04
    # Sized from the scan, not from the catalog size. full_sync walks the
    # whole AniList id space in id_in batches of PER_PAGE=50, from id 1 to
    # max_id, because AniList rejects a paginated query past a 5000-row
    # offset. max_id is around 190k, so that is ~3,800 requests at the
    # two-second floor: a little over two hours, not the fifteen minutes
    # that 22k anime over fifty-per-page suggests. Two earlier caps here
    # (35 then 120) were sized against the catalog instead of the scan and
    # would both have killed the run just short of the measurement.
    timeout-minutes: 215
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mangabrain
          POSTGRES_PASSWORD: mangabrain
          POSTGRES_DB: mangabrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mangabrain -d mangabrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://mangabrain:mangabrain@localhost:5432/mangabrain
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No torch and no sentence-transformers: the match is title arithmetic
      # against ANN's index, so the embedding stack would only slow the job.
      - name: Install project (no embedding stack)
        run: pip install -e .

      - name: Sync the anime catalog
        timeout-minutes: 180
        run: python -m pipeline.sync_anilist --type anime

      # always() because a partial catalog still measures a match rate. The
      # scan checkpoints in sync_state after every batch, so whatever it got
      # through is coherent data rather than a half-written row, and a cap
      # that fired would otherwise throw away a usable measurement.
      - name: Measure ANN exact-match rate
        if: always()
        timeout-minutes: 25
        run: python -m pipeline.backfill_dub_ann --dry-run

name: dub-probe

# Research probe: is English voice-actor data a usable dub signal, and does
# its coverage survive into the long tail? AniList has no dub field, so the
# candidate signal is "an English voice actor is credited". This runs on CI
# because CI can reach AniList. The MAL cross-check cannot run anywhere:
# Jikan's public API was discontinued on 1 October 2026 (jikan-rest issue
# #613), so "unreachable from GitHub's runners" - which this file used to
# say - was the symptom of a shutdown rather than a property of runners.
# Results appear in the step logs; nothing is written anywhere.
on:
  workflow_dispatch:
    inputs:
      per_stratum:
        description: titles sampled per popularity stratum
        required: false
        default: "15"
      cross_check:
        description: AniList-silent titles to re-check against MAL (0 to skip;
          Jikan's public API was discontinued on 1 Oct 2026, so this
          answers nowhere; kept for the record)
        required: false
        default: "0"
      sources:
        description: instead of sampling AniList, probe other dub sources for
          reachability and dump their raw responses
        required: false
        default: "false"
      crosscheck:
        description: bound AniList's dub false negatives against ANN (the
          measurement Jikan was meant to provide before it started refusing
          both CI and the deployment host)
        required: false
        default: "false"
      ann_lookups:
        description: max ANN title lookups in a crosscheck run
        required: false
        default: "30"
      wikidata:
        description: the last untried source. Joins by MyAnimeList id and
          answers in one SPARQL query, so it is cheap to rule in or out.
          Property ids are discovered, not recalled.
        required: false
        default: "false"
      studios:
        description: derive which studios actually predict an English dub,
          ranked by a 95% lower bound so thin support cannot top the list.
          Targets AniList's false negatives, not the no-cast gap.
        required: false
        default: "false"
      signals:
        description: can an English dub be inferred for the 38.2% of titles
          with NO cast recorded at all, from dub-studio credits or
          dub-platform links? Both are in AniList's schema and unfetched.
        required: false
        default: "false"
      one_call:
        description: can ONE unfiltered request return every dub language, by
          reading languageV2 off each voice actor instead of filtering? Would
          cut the language walk from ~4,000 requests to ~444.
        required: false
        default: "false"
      anidb:
        description: evaluate AniDB as a dub source. Sends only a handful of
          requests, because AniDB bans IPs for automated access and its terms
          restrict bulk use - that constraint IS the finding, not a detail.
        required: false
        default: "false"
      kitsu:
        description: probe Kitsu as a dub source. The reason to care is its
          mappings resource, which may carry AniList/MAL ids - an id join
          would remove the name matching that caps ANN at 31.8%.
        required: false
        default: "false"
      languages:
        description: can AniList answer for every dub language at once via
          aliased fields? Would lift non-English dubs off ANN's 31.8% name
          match onto measured per-entry coverage of the whole catalog.
        required: false
        default: "false"
      jikan:
        description: >-
          one request to a Jikan-shaped /anime/{id}/characters. "jikan"
          (or "true") hits api.jikan.moe, whose public API was
          discontinued on 1 Oct 2026 - measured here, it hangs four
          minutes and fails. "tenrai" hits api.tenrai.org/v1, the
          successor the migrating projects name and report to be
          schema-compatible with Jikan v4. Any other value is used as a
          base URL verbatim. Reported compatibility is not measured
          compatibility, which is what this step is for.
        required: false
        default: "false"
      fandom:
        description: >-
          inspect dubbing.fandom.com page structure (recon). "true" uses the
          built-in controls (one title our sources handle plus the two this
          investigation failed on); a comma-separated list probes those
          titles instead. One input rather than a flag and a list because
          workflow_dispatch documents a limit of ten and this file already
          carries more. A MediaWiki, so api.php is a real public API, but it
          holds no AniList or MAL ids, so every lookup is a title match.
          Runs here because the dev container's egress proxy refuses the host.
        required: false
        default: "false"
      paged_cast:
        description: can a cast be fetched for a PAGE of media rather than one
          title per request? Decides the English walk's cost by 50x. The probe
          that ruled it out also omitted node, which nulls voiceActors on its
          own, so the two were never separated.
        required: false
        default: "false"

permissions:
  contents: read

# Keyed by probe kind, not just the ref. Grouping every probe together meant
# dispatching one cancelled another mid-run: the ANN cross-check was killed
# and deleted by a reports probe queued while it was still working.
concurrency:
  group: >-
    dub-probe-${{ github.ref }}-${{ inputs.crosscheck || 'n' }}-${{ inputs.sources || 'n' }}-${{ inputs.paged_cast || 'n' }}-${{ inputs.languages || 'n' }}-${{ inputs.kitsu || 'n' }}-${{ inputs.anidb || 'n' }}-${{ inputs.one_call || 'n' }}-${{ inputs.signals || 'n' }}-${{ inputs.studios || 'n' }}-${{ inputs.wikidata || 'n' }}-${{ inputs.fandom || 'n' }}-${{ inputs.jikan || 'n' }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Without this the probe's streaming log stays empty until it exits.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # httpx alone was enough while every probe here spoke only HTTP.
      # probe_dub_mal reaches api.config and, through NATIVE_LANGS in
      # backfill_dub_ann, psycopg - at import, before any database is
      # touched. Making the connection lazy in probe_dub_mal was not
      # enough on its own because of that transitive import, and chasing
      # it further would mean refactoring a backfill module to suit a
      # reachability check.
      - name: Install dependencies
        run: |
          pip install "httpx>=0.27" "pydantic-settings>=2.3" \
            "psycopg[binary]>=3.2" "psycopg-pool>=3.2"

      # Runners have open outbound internet, unlike the dev container whose
      # egress proxy blocks these hosts. That distinction is why the other
      # sources went unmeasured for too long.
      - name: Cross-check AniList silence against ANN
        if: inputs.crosscheck == 'true'
        run: |
          python -m pipeline.probe_dub_crosscheck \
            --per-stratum "${{ inputs.per_stratum || '10' }}" \
            --limit "${{ inputs.ann_lookups || '30' }}"

      - name: Evaluate Wikidata
        if: inputs.wikidata == 'true'
        run: python -m pipeline.probe_wikidata

      - name: Derive dub-predicting studios
        if: inputs.studios == 'true'
        run: python -m pipeline.probe_dub_studios --sample 1000 --min-support 5

      - name: Probe inferable dub signals
        if: inputs.signals == 'true'
        run: python -m pipeline.probe_dub_signals --sample 300

      - name: Probe one-call language retrieval
        if: inputs.one_call == 'true'
        run: python -m pipeline.probe_dub_one_call

      - name: Evaluate AniDB
        if: inputs.anidb == 'true'
        run: python -m pipeline.probe_anidb --confirm

      - name: Probe Kitsu
        if: inputs.kitsu == 'true'
        run: python -m pipeline.probe_kitsu --sample 200 --raw

      # Separate from the measurement above: this one asks what the API is,
      # rather than measuring through an assumed shape. It runs with the
      # same input because a measurement taken against the wrong resource
      # is worth less than knowing which resource is right.
      # Read the spec before interrogating the server: the spec says which
      # resource is current and what each filter is actually called, which
      # is the thing three measurements have now guessed at.
      - name: Read Kitsu's OpenAPI spec
        if: inputs.kitsu == 'true'
        run: python -m pipeline.probe_kitsu_spec --all-paths

      - name: Discover Kitsu's cast API shape
        if: inputs.kitsu == 'true'
        run: python -m pipeline.probe_kitsu_shape --skip-docs

      # One request, and the only thing it can establish: whether the
      # host answers at all. No database, so it runs here rather than on
      # the deployment host - which is the point, since the recorded
      # blocker was measured from both and deserves re-checking from both.
      - name: Is the cast API reachable from a runner
        if: inputs.jikan != '' && inputs.jikan != 'false'
        env:
          # Through the environment: the value may be a URL from a
          # dispatch form, and ${{ }} is substituted before bash sees it.
          BASE: ${{ inputs.jikan }}
        run: |
          [ "$BASE" = "true" ] && BASE=jikan
          python -m pipeline.probe_dub_mal --check --base-url "$BASE"

      # Structure first, measurement second. The parser in the module is
      # a guess at a format nobody has inspected; this step is how that
      # guess gets replaced by what the pages actually contain. The probe
      # subcommand that produces a number needs the catalog, so it runs on
      # the deployment host, not here.
      - name: Inspect the Dubbing Wiki
        if: inputs.fandom != '' && inputs.fandom != 'false'
        env:
          # Through the environment, not interpolated into the script: a
          # title is free text from a dispatch form, and ${{ }} inside a
          # run block is substituted before bash ever sees it.
          FANDOM: ${{ inputs.fandom }}
        run: |
          if [ "$FANDOM" = "true" ]; then
            python -m pipeline.probe_dub_fandom recon
          else
            ARGS=()
            IFS=',' read -ra TITLES <<< "$FANDOM"
            for title in "${TITLES[@]}"; do
              trimmed="$(echo "$title" | sed -e 's/^ *//' -e 's/ *$//')"
              [ -n "$trimmed" ] && ARGS+=(--title "$trimmed")
            done
            python -m pipeline.probe_dub_fandom recon "${ARGS[@]}"
          fi
          # How many pages carry each cross-reference id template. This is
          # the number that decides whether the wiki can be joined by id
          # instead of by title, which is the difference between a usable
          # source and another ANN.
          python -m pipeline.probe_dub_fandom coverage
          # The fetch-and-parse half of the census: how many of those pages
          # carry a usable AniList id and name a dub cast. The comparison
          # against our own gap needs the catalog, so it runs on the
          # deployment host; this proves the reading half works and costs
          # about thirteen requests.
          python -m pipeline.probe_dub_fandom census --no-db

      - name: Probe AniList's dub languages
        if: inputs.languages == 'true'
        run: python -m pipeline.probe_dub_languages --chars 25

      - name: Probe paged cast retrieval
        if: inputs.paged_cast == 'true'
        run: python -m pipeline.probe_paged_cast --chars 25

      - name: Probe other sources
        if: inputs.sources == 'true'
        run: |
          python -m pipeline.probe_dub_sources --dump --docs --reports --reachability

      - name: Probe
        if: inputs.sources != 'true' && inputs.crosscheck != 'true'
          && inputs.paged_cast != 'true' && inputs.languages != 'true'
          && inputs.kitsu != 'true' && inputs.anidb != 'true'
          && inputs.one_call != 'true' && inputs.signals != 'true' && inputs.studios != 'true' && inputs.wikidata != 'true'
          && (inputs.fandom == '' || inputs.fandom == 'false')
          && (inputs.jikan == '' || inputs.jikan == 'false')
        run: |
          python -m pipeline.probe_dub_coverage \
            --per-stratum "${{ inputs.per_stratum || '15' }}" \
            --cross-check "${{ inputs.cross_check || '0' }}"

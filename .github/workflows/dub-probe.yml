name: dub-probe

# One-off research probe: is English voice-actor data a usable dub signal, and
# does its coverage survive into the long tail? AniList has no dub field, so
# the candidate signal is "an English voice actor is credited". This runs on CI
# because CI can reach AniList and Jikan. Results appear in the "Probe" step
# log; nothing is written anywhere.
on:
  # Temporary: a workflow_dispatch workflow is not dispatchable until the
  # file reaches the default branch, and this is a one-off measurement, so
  # it runs on push to the working branch and the trigger comes back out.
  push:
    branches: [claude/work-in-progress-1dzs1q]
  workflow_dispatch:
    inputs:
      per_stratum:
        description: titles sampled per popularity stratum
        required: false
        default: "10"
      cross_check:
        description: AniList-silent titles to re-check against MAL (0 to skip)
        required: false
        default: "15"

permissions:
  contents: read

concurrency:
  group: dub-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Without this the probe's streaming log stays empty until it exits.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install "httpx>=0.27"

      - name: Probe
        run: |
          python -m pipeline.probe_dub_coverage \
            --per-stratum "${{ inputs.per_stratum || '10' }}" \
            --cross-check "${{ inputs.cross_check || '15' }}"

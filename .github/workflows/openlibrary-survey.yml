name: openlibrary-survey

# How much of Open Library carries enough content to rank? The answer
# decides the catalogue size, the embedding hours, and whether books
# ship as their own dataset artifact - so it is measured before a schema
# is designed around a guess.
#
# A separate workflow rather than a step in media-source-probe: that one
# answers "which sources are usable" in a couple of minutes, this one
# streams tens of gigabytes and takes tens of minutes. Sharing a job
# would mean a quick reconnaissance could not be run without paying for
# a full survey.
#
# Runs here rather than on the deployment host because a runner has the
# bandwidth for the dump and nothing else to do with it. The survey
# needs no database, no credential and no disk: the dump is streamed and
# counted, never stored.
on:
  workflow_dispatch:
    inputs:
      survey:
        description: "content = how much is rankable; ratings = would a score column mean anything; hardcover = what Hardcover would add (needs the HARDCOVER_TOKEN secret)"
        required: false
        type: choice
        default: content
        options:
          - content
          - ratings
          - hardcover
      limit:
        description: "rows to read; 0 reads the whole dump (tens of minutes)"
        required: false
        default: "2000000"
      min_description:
        description: characters of description a work must have to count
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: openlibrary-survey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  survey:
    runs-on: ubuntu-latest
    # The dump is tens of gigabytes uncompressed and parsed line by
    # line, so a full pass is tens of minutes. Short of the 360-minute
    # ceiling, with room for the dump to grow.
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "httpx>=0.27"

      - name: Survey content
        if: ${{ (inputs.survey || 'content') == 'content' }}
        run: |
          python -m pipeline.survey_openlibrary \
            --limit "${{ inputs.limit || '2000000' }}" \
            --min-description "${{ inputs.min_description || '200' }}"

      # Reads a second dump the works dump knows nothing about, and joins
      # the two on the work key. Same gate as the content survey, so the
      # coverage figure is coverage of the books we would actually import
      # rather than of Open Library at large.
      - name: Survey ratings
        if: ${{ inputs.survey == 'ratings' }}
        run: |
          python -m pipeline.survey_openlibrary_ratings \
            --limit "${{ inputs.limit || '2000000' }}" \
            --min-description "${{ inputs.min_description || '200' }}"

      # Samples importable and description-rejected works from the first
      # rows of the dump, finds their ISBNs on Open Library and looks
      # them up on Hardcover. Needs a Hardcover API token in the
      # HARDCOVER_TOKEN repository secret; limit 0 is not meaningful
      # here, so it falls back to 400,000 rows.
      - name: Survey Hardcover
        if: ${{ inputs.survey == 'hardcover' }}
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          ROWS: ${{ inputs.limit }}
        run: |
          if [ -z "$ROWS" ] || [ "$ROWS" = "0" ] || [ "$ROWS" = "2000000" ]; then ROWS=400000; fi
          python -m pipeline.survey_hardcover \
            --rows "$ROWS" \
            --min-description "${{ inputs.min_description || '200' }}" \
            --json hardcover-survey.json

      - name: Upload Hardcover result
        if: ${{ inputs.survey == 'hardcover' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hardcover-survey
          path: hardcover-survey.json
          if-no-files-found: ignore

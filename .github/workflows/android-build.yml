name: Android APK

# Adapted from Breezyslasher/Yamtrack_andriod's build workflow. Two
# differences that matter:
#
#  1. The Android project lives in android/, not at the repository root, so
#     every Gradle step runs from there while the action steps (cache,
#     upload) keep repo-relative paths.
#  2. Only android/** triggers it. This repository is mostly Python, and an
#     SDK download plus a Gradle build on every pipeline or docs commit
#     would spend several minutes to rebuild something that did not change.
#
# Debug builds only, deliberately: app/build.gradle declares no signingConfig,
# so assembleRelease would emit app-release-unsigned.apk, which cannot be
# installed. Release signing (keystore secrets, a tagged GitHub release) is a
# follow-up, and wiring the jobs before the signing config exists would ship a
# button that produces a useless artifact.

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions: write is what the Gradle cache needs. The first run logged
      # "cache write denied: token has no writable scopes" and saved nothing,
      # so every build paid the full ~85s instead of reusing the dependency
      # cache. An explicit permissions block drops every scope it does not
      # name, which is what removed it.
      actions: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Not the default package set: that also installs the legacy
          # 'tools' package, which the SDK repository no longer serves, and
          # sdkmanager fails on it.
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # No --stacktrace: a Kotlin compile failure prints three useful "e:"
      # lines and then roughly 250 lines of Gradle internals, which pushed
      # the actual errors out of every reasonable log tail. Gradle's own
      # summary already names the failing task.
      # set -o pipefail is load-bearing: the step shell is `bash -e`, which
      # takes the exit status of the LAST command in a pipeline, so piping
      # Gradle through tee without it would report a failed build as a
      # success and upload no APK while the job stayed green.
      #
      # No --stacktrace either: a Kotlin compile failure prints three useful
      # "e:" lines followed by roughly 250 lines of Gradle internals, which
      # pushed the actual errors out of every reasonable log tail.
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The errors again at the very end, where a tail finds them.
      - name: Repeat compiler errors
        if: failure()
        run: |
          echo "--- Kotlin/Java diagnostics from this build ---"
          grep -E "^(e|w): " "$RUNNER_TEMP/build.log" || echo "(no e:/w: lines; the failure was not a compile error)"

      - name: Locate APKs
        id: locate
        run: |
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "Gradle succeeded but produced no APK" >&2
            exit 1
          fi
          # Paths are emitted repo-relative: upload-artifact does not honour
          # the job's working-directory.
          {
            echo 'paths<<EOF'
            printf 'android/%s\n' "${apks[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mangabrain-android-${{ github.run_number }}
          path: ${{ steps.locate.outputs.paths }}
          if-no-files-found: error

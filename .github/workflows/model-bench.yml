name: model-bench

# On-demand embedding-model bake-off on CI hardware (4 cores, 16 GB - faster
# than a NAS and free), so candidate models get measured without loading the
# home server. Builds its world from scratch: restores the published catalog
# snapshot (only the text matters, not its embeddings), fetches the human
# recommendation pairs from AniList, then prints recall@10/@50 and MRR per
# model. Results appear in the "Run benchmark" step log.
on:
  workflow_dispatch:
    inputs:
      models:
        description: models to compare (space or comma separated)
        required: false
        default: >-
          avsolatorio/GIST-small-Embedding-v0
          avsolatorio/GIST-Embedding-v0
      negatives:
        description: random negative titles added to the ranking pool
        required: false
        default: "5000"
      trust_remote_code:
        description: allow models shipping custom code (jina v5 etc.); runs third-party code
        required: false
        default: "false"
      mode:
        description: >-
          "models" compares embedding models by raw cosine, which is all
          this benchmark could ever do. "score" ranks by the real
          weighted score - semantic, tags, genres - and reports r@10 with
          an absent genre list treated as undefined and as zero, so a
          change to the ranking function can be measured instead of
          argued.
        required: false
        default: models
        type: choice
        options:
          - models
          - score
      weights:
        description: 'score mode: semantic,tags,genres - the API defaults'
        required: false
        default: 0.5,0.3,0.2

permissions:
  contents: read

jobs:
  bench:
    # Pinned, not ubuntu-latest. The pgvector service is pg16 and these jobs
    # shell out to pg_dump/pg_restore against it, and ubuntu-latest has rolled
    # to Ubuntu 26.04 "resolute", whose archive no longer carries
    # postgresql-client-16: "E: Unable to locate package
    # postgresql-client-16", which failed the job 30 seconds in. 24.04 still
    # has it. The alternative, PGDG's apt repo, has no resolute suite yet, so
    # pinning is the predictable fix; revisit when pg16 client packages exist
    # for a newer runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mangabrain
          POSTGRES_PASSWORD: mangabrain
          POSTGRES_DB: mangabrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mangabrain -d mangabrain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://mangabrain:mangabrain@localhost:5432/mangabrain
      # Python block-buffers stdout into a pipe, so without this the
      # long sync/embed/benchmark steps show an empty log until they
      # finish. The container image sets it too; CI runs pip-installed
      # Python directly and needs it here.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install .

      - name: Restore catalog snapshot
        # ensure_schema runs first, so extensions and tables exist before
        # pg_restore. The snapshot's embeddings are irrelevant here; the
        # bench embeds fresh with each candidate model.
        run: |
          python -m pipeline.restore --url \
            https://github.com/Breezyslasher/MangaBrain/releases/latest/download/mangabrain-dataset.dump

      - name: Fetch recommendation pairs
        run: python -m pipeline.benchmark fetch --out pairs.json

      - name: Rank by the weighted score
        if: inputs.mode == 'score'
        run: |
          python -m pipeline.benchmark score --pairs-file pairs.json \
            --negatives "${{ inputs.negatives || '2000' }}" \
            --weights "${{ inputs.weights || '0.5,0.3,0.2' }}"

      - name: Run benchmark
        if: inputs.mode != 'score'
        env:
          # Optional: lets gated models (e.g. google/embeddinggemma-300m)
          # download. Unset is fine for the default list.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ARGS=""
          for m in $(echo "${{ github.event.inputs.models }}" | tr ',' ' '); do
            ARGS="$ARGS --model $m"
          done
          if [ "${{ github.event.inputs.trust_remote_code }}" = "true" ]; then
            ARGS="$ARGS --trust-remote-code"
          fi
          python -m pipeline.benchmark run --pairs-file pairs.json \
            --negatives "${{ github.event.inputs.negatives }}" \
            --encode-batch-size 32 $ARGS

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mangabrain.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mangabrain.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        // Blank on purpose: a self-hosted app has no default server, and
        // guessing one would send a first run at somebody else's host.
        buildConfigField "String", "DEFAULT_SERVER_URL", '""'
    }

    buildFeatures {
        buildConfig true
    }

    // Override AGP's default debug signing. Without this, every machine and
    // every CI runner generates its own ~/.android/debug.keystore, so two
    // debug APKs of the same app carry different signing certificates and
    // Android refuses to update one over the other - it reports
    // INSTALL_FAILED_UPDATE_INCOMPATIBLE, which the installer shows as the
    // unhelpful "App not installed".
    //
    // The committed keystore uses the well-known Android debug credentials.
    // It is deliberately not a secret: it signs debug builds only, it
    // cannot publish to Play, and its whole purpose is that every build
    // everywhere shares one certificate. A release key would be handled the
    // opposite way, through secrets, and is a separate job.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // An unsigned release APK cannot be installed at all, so until
            // a real release key exists it is signed with the debug one.
            // That makes it installable and sideloadable; it does NOT make
            // it releasable.
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Deliberately NO Hilt/kapt, no ViewBinding, no Navigation component. This
// first slice is three screens; annotation processing and code generation
// are the parts of an Android build most likely to fail in ways unrelated
// to the app, and manual wiring (see ServiceLocator) costs a few lines.
// Add Hilt later if the screen count grows enough to earn it.
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.moshi:moshi:1.15.1'
    // Reflective adapter: no codegen, so no kapt.
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'

    implementation 'io.coil-kt:coil:2.5.0'
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// A Play upload must be signed with a release key and carry a version code
// higher than the last one. Both come from the environment, set by
// .github/workflows/apps.yml (release builds) from repository secrets; nothing
// secret is ever committed. Without them a release build still works for
// sideloading, signed with the shared debug key.
def releaseKeystore = System.getenv("MANGABRAIN_KEYSTORE_FILE")
def hasReleaseKey = releaseKeystore != null && !releaseKeystore.isEmpty() && file(releaseKeystore).exists()

android {
    namespace 'com.mangabrain.app'
    // 36: Google Play requires new apps and updates to target a recent
    // Android release (36 from 2026). Android 15 and later draw an app
    // edge to edge, under the status and navigation bars, and 36 removes
    // the opt-out; MainActivity pads the screens for the bars and the
    // keyboard instead.
    compileSdk 36

    defaultConfig {
        // The app's identity on Google Play and on a phone; permanent once a
        // build is uploaded to Play. Not the code's package: `namespace`
        // above stays com.mangabrain.app, so no source file moves. Changed
        // from com.mangabrain.app before the first Play upload; a phone
        // with the old id installed keeps it as a separate app.
        applicationId "io.github.breezyslasher.mangabrain"
        minSdk 24
        targetSdk 36
        // CI passes a number that only grows (the Build apps workflow's run
        // number plus 100); a local build is 1.
        versionCode((System.getenv("MANGABRAIN_VERSION_CODE") ?: "1").toInteger())
        versionName(System.getenv("MANGABRAIN_VERSION_NAME") ?: "0.1.0")
        // Blank on purpose: a self-hosted app has no default server, and
        // guessing one would send a first run at somebody else's host.
        buildConfigField "String", "DEFAULT_SERVER_URL", '""'
    }

    buildFeatures {
        buildConfig true
    }

    // Override AGP's default debug signing. Without this, every machine and
    // every CI runner generates its own ~/.android/debug.keystore, so two
    // debug APKs of the same app carry different signing certificates and
    // Android refuses to update one over the other - it reports
    // INSTALL_FAILED_UPDATE_INCOMPATIBLE, which the installer shows as the
    // unhelpful "App not installed".
    //
    // The committed keystore uses the well-known Android debug credentials.
    // It is deliberately not a secret: it signs debug builds only, it
    // cannot publish to Play, and its whole purpose is that every build
    // everywhere shares one certificate. A release key would be handled the
    // opposite way, through secrets, and is a separate job.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (hasReleaseKey) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("MANGABRAIN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MANGABRAIN_KEY_ALIAS")
                keyPassword System.getenv("MANGABRAIN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The release key when the environment provides one (the Play
            // build); otherwise the debug key, which makes it installable
            // and sideloadable but NOT releasable.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Deliberately NO Hilt/kapt, no ViewBinding, no Navigation component. This
// first slice is three screens; annotation processing and code generation
// are the parts of an Android build most likely to fail in ways unrelated
// to the app, and manual wiring (see ServiceLocator) costs a few lines.
// Add Hilt later if the screen count grows enough to earn it.
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.moshi:moshi:1.15.1'
    // Reflective adapter: no codegen, so no kapt.
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'

    implementation 'io.coil-kt:coil:2.5.0'
}

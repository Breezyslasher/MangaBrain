[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangabrain"
version = "0.1.0"
description = "Self-hosted content-based recommendation engine for anime, manga, manhwa, manhua, light novels, and one-shots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI Query defaults and the frozen Weights dataclass are immutable.
extend-immutable-calls = ["fastapi.Query", "api.scoring.Weights"]

[tool.pytest.ini_options]
testpaths = ["tests"]

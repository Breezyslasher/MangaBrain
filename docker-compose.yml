services:
  db:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    environment:
      POSTGRES_USER: mangabrain
      POSTGRES_PASSWORD: ${MANGABRAIN_DB_PASSWORD:-mangabrain}
      POSTGRES_DB: mangabrain
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    # Bound to localhost only (for host-side dev tools); the api and worker
    # containers reach the db over the compose network, not this mapping.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangabrain -d mangabrain"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mangabrain:${MANGABRAIN_DB_PASSWORD:-mangabrain}@db:5432/mangabrain
      # Set MANGABRAIN_AUTH_TOKEN before exposing the app publicly (e.g.
      # through a Cloudflare Tunnel); empty keeps the LAN-only open behavior.
      AUTH_TOKEN: ${MANGABRAIN_AUTH_TOKEN:-}
      RATE_LIMIT_PER_MINUTE: ${MANGABRAIN_RATE_LIMIT:-0}
      # Official MyAnimeList API client id, for MAL list exclusion. Free
      # from https://myanimelist.net/apiconfig; empty disables the feature
      # with a message saying so. Jikan's user-list endpoints were
      # discontinued in 2022, so there is no credential-free route.
      MAL_CLIENT_ID: ${MANGABRAIN_MAL_CLIENT_ID:-}
      # Optional list and catalogue credentials (see .env.example). The
      # settings pages can store each of these instead, which wins.
      YAMTRACK_URL: ${YAMTRACK_URL:-}
      YAMTRACK_TOKEN: ${YAMTRACK_TOKEN:-}
      HARDCOVER_TOKEN: ${HARDCOVER_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    ports:
      - "8009:8000"
    restart: unless-stopped

  # Same image as the API. Runs the nightly incremental AniList sync followed
  # by an embedding pass for anything new. One-off jobs (full sync, backfill)
  # are run through this service, e.g.:
  #   docker compose run --rm worker python -m pipeline.sync_anilist --type anime
  worker:
    build: .
    platform: linux/amd64
    command: python -m pipeline.nightly
    # A quarter of the default CPU weight (1024): under contention other
    # containers and host apps win, while idle cycles still run the embed
    # pass at full speed. Torch is additionally capped to cores-1 threads
    # (EMBED_THREADS) so one core always stays free for the rest of the box.
    cpu_shares: 256
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mangabrain:${MANGABRAIN_DB_PASSWORD:-mangabrain}@db:5432/mangabrain
      SYNC_INTERVAL_HOURS: "24"
      EMBED_THREADS: ${MANGABRAIN_EMBED_THREADS:-0}
      # Optional list and catalogue credentials (see .env.example). The
      # settings pages can store each of these instead, which wins.
      YAMTRACK_URL: ${YAMTRACK_URL:-}
      YAMTRACK_TOKEN: ${YAMTRACK_TOKEN:-}
      HARDCOVER_TOKEN: ${HARDCOVER_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
      # The Open Library dump, 4 GB, kept between runs. Named rather
      # than a bind mount so it survives the container being recreated,
      # which is what kills a `docker exec` import. Without it every
      # restart re-downloads the dump at ~388 KB/s.
      - dump_cache:/root/.cache/mangabrain
    restart: unless-stopped

volumes:
  db_data:
  hf_cache:
  dump_cache:

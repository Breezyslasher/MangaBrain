# XcodeGen spec: `xcodegen generate` (run by CI) creates MangaBrain.xcodeproj.
# The generated project is not committed. Same layout as the Yamtrack
# Unofficial iOS app (Breezyslasher/Yamtrack_andriod), which this follows.
name: MangaBrain
options:
  bundleIdPrefix: io.github.breezyslasher
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MangaBrain:
    type: application
    platform: iOS
    # A shared scheme, so CI can build with `xcodebuild -scheme MangaBrain`.
    scheme: {}
    sources:
      - path: MangaBrain
    settings:
      base:
        # The same application id as the Android app.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.breezyslasher.mangabrain
        PRODUCT_NAME: MangaBrain
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MangaBrain
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: MangaBrain/Info.plist
      properties:
        # A self-hosted server is usually plain HTTP on the home network,
        # and the Android app allows cleartext for the same reason.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: MangaBrain connects to your own MangaBrain server on your network.
        UIUserInterfaceStyle: Dark

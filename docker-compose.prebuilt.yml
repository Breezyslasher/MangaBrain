# Standalone stack using the prebuilt image from GitHub Container Registry.
# Copy this single file anywhere and run:
#
#   docker compose -f docker-compose.prebuilt.yml up -d
#
# No repository checkout needed: the services apply the database schema
# themselves, and on first start the worker seeds the catalog from the
# published weekly snapshot (media, embeddings, sync checkpoints), then keeps
# it current with nightly incremental syncs. If the snapshot is unavailable
# the worker falls back to a full AniList sync automatically. Web UI at
# http://<host>:8009 (change the left side of the api port mapping if taken).

# Pinned project name so volumes stay stable (mangabrain_db_data etc.)
# no matter which directory or UI the file is deployed from.
name: mangabrain

services:
  db:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    environment:
      POSTGRES_USER: mangabrain
      POSTGRES_PASSWORD: ${MANGABRAIN_DB_PASSWORD:-mangabrain}
      POSTGRES_DB: mangabrain
    volumes:
      - db_data:/var/lib/postgresql/data
    # Bound to localhost only; containers reach the db over the compose network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangabrain -d mangabrain"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: ghcr.io/breezyslasher/mangabrain:latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mangabrain:${MANGABRAIN_DB_PASSWORD:-mangabrain}@db:5432/mangabrain
      # Set MANGABRAIN_AUTH_TOKEN before exposing the app publicly (e.g.
      # through a Cloudflare Tunnel); empty keeps the LAN-only open behavior.
      AUTH_TOKEN: ${MANGABRAIN_AUTH_TOKEN:-}
      RATE_LIMIT_PER_MINUTE: ${MANGABRAIN_RATE_LIMIT:-0}
    ports:
      - "8009:8000"
    restart: unless-stopped

  worker:
    image: ghcr.io/breezyslasher/mangabrain:latest
    platform: linux/amd64
    command: python -m pipeline.nightly
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mangabrain:${MANGABRAIN_DB_PASSWORD:-mangabrain}@db:5432/mangabrain
      SYNC_INTERVAL_HOURS: "24"
      SEED_SNAPSHOT_URL: https://github.com/Breezyslasher/MangaBrain/releases/download/dataset-latest/mangabrain-dataset.dump
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  db_data:
  hf_cache:
